[project]
name = "sop-review-grader"
version = "0.1.0"
description = "Production-ready SOP Review & Grader for Master's applicants."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai-runtime",
    "streamlit>=1.41.1,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "plotly>=6.0.0,<7.0.0",
    "pydantic>=2.10.4,<3.0.0",
]

[tool.uv.sources]
ai-runtime = { path = "../../packages/ai_runtime", editable = true }

[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sop_review", "sop_review.prompts"]
