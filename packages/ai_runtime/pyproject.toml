[project]
name = "ai-runtime"
version = "0.1.0"
description = "Shared AI runtime for the study abroad platform."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9.0.0",
]

[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_runtime"]
