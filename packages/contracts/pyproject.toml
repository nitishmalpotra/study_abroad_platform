[project]
name = "study-abroad-contracts"
version = "0.1.0"
description = "Shared API contracts for the study abroad platform."
requires-python = ">=3.11"
dependencies = [
  "college-admission-predictor",
  "pydantic>=2.10.0,<3.0.0",
  "sop-review-grader",
]

[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["study_abroad_contracts"]

[tool.uv.sources]
college-admission-predictor = { path = "../../services/admissions", editable = true }
sop-review-grader = { path = "../../services/sop_review", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
