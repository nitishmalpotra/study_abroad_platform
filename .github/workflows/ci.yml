name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  admissions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admissions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check app.py
      - run: uv run pytest
      - run: uv run python -m py_compile app.py

  sop-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sop_review
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - run: uv run python -m py_compile app.py
